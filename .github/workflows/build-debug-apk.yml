name: Clonar APK 3.5.0 para Alsvin
on:
  push:
  workflow_dispatch:

jobs:
  patch-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zipalign apksigner

      - name: Descompilar y cambiar nombre de paquete
        run: |
          apktool d -r com.andrerinas.headunitrevived_3.5.0.apk -o apk_mod
          sed -i 's/renameManifestPackage: null/renameManifestPackage: com.andrerinas.headunitmedia/g' apk_mod/apktool.yml
          apktool b apk_mod -o impostor_unsigned.apk
          zipalign -p -f 4 impostor_unsigned.apk impostor_aligned.apk

      - name: Firmar con esquema v1 + v2 para Android 6.0
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --out OpenHeadunit_3.5.0_Impostor.apk impostor_aligned.apk

      - name: Subir APK listo
        uses: actions/upload-artifact@v4
        with:
          name: APK-Listo-Alsvin
          path: OpenHeadunit_3.5.0_Impostor.apk
